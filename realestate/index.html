<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>不動産 制作例｜FA Project</title>
<meta name="description" content="FA Projectが全編AIで制作した不動産（マンション・住宅）向け動画の制作例。撮影なし・従来の1/10の費用・最短1週間。">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d10;--fg:#f4f5f7;--mute:#9aa3ad;--line:#232830;--accent:#ffcc33}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:40px 16px 56px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
h1{font-size:22px;font-weight:700;letter-spacing:.02em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;font-weight:700;color:#111;background:var(--accent);border-radius:999px;padding:3px 12px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr;gap:22px}}
figure{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
video,.yt{display:block;width:100%;aspect-ratio:16/9;background:#000;border:0}
figcaption{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:8px 12px;background:#12151a}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
footer a{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>FA Project 不動産 制作例<small>マンション・住宅の紹介動画／すべて撮影なし・全編AI制作</small></h1>
</header>

<div class="grid">
  <!-- 追加のしかた（1本1行）
       YouTube: <figure><iframe class="yt" src="https://www.youtube-nocookie.com/embed/動画ID?rel=0&enablejsapi=1" title="SAMPLE n" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe><figcaption><span>SAMPLE n</span><span>〇〇秒</span></figcaption></figure>
       mp4   : <figure><video src="../media/re_n.mp4" poster="../media/re_n.jpg" preload="metadata" playsinline controls></video><figcaption><span>SAMPLE n</span><span>〇〇秒</span></figcaption></figure>
  -->
  <figure><iframe class="yt" src="https://www.youtube-nocookie.com/embed/2PW6TPaEwus?rel=0&enablejsapi=1" title="SAMPLE 1" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe><figcaption><span>SAMPLE 1</span><span>マンション紹介</span></figcaption></figure>
  <figure><video src="../media/re_2.mp4" poster="../media/re_2.jpg" preload="metadata" playsinline controls></video><figcaption><span>SAMPLE 2</span><span>浦和（朝・全編5分）</span></figcaption></figure>
  <figure><video src="../media/re_3.mp4" poster="../media/re_3.jpg" preload="metadata" playsinline controls></video><figcaption><span>SAMPLE 3</span><span>池袋 402（51秒）</span></figcaption></figure>
</div>

<footer>
  <span>株式会社FA Project（KeyHolderグループ）</span>
  <a href="https://faproject.co.jp/" target="_blank" rel="noopener">会社HP</a>
</footer>
</div>
<script>
// 1本再生したら他は止める
document.querySelectorAll('video').forEach(v=>v.addEventListener('play',()=>{document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()})}));

// 閲覧の記録（Googleフォームへ送る。失敗しても画面には何も出さない）
(function(){
  var F='https://docs.google.com/forms/d/e/1FAIpQLSeXPeh3IpDMHmI2kVQYXYthmN_kxay2t0dIlt4cEmOI1c5EtA/formResponse';
  var E={kind:'entry.605416468',c:'entry.257427294',video:'entry.1666794312',sec:'entry.256913221',ref:'entry.594033521',dev:'entry.703984110'};
  var t0=Date.now();
  // 会社番号: URL の c → 無ければ同じタブの sessionStorage → 無ければ direct
  var c='';
  try{c=new URLSearchParams(location.search).get('c')||''}catch(e){}
  try{if(c){sessionStorage.setItem('fa_c',c)}else{c=sessionStorage.getItem('fa_c')||''}}catch(e){}
  if(!c)c='direct';
  var ref='none';
  try{if(document.referrer)ref=new URL(document.referrer).host||'none'}catch(e){}
  var dev='pc';
  try{if(/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.innerWidth<700)dev='mobile'}catch(e){}

  function params(o){
    var p=new URLSearchParams();
    p.append(E.c,c);
    for(var k in o){if(o[k]!==undefined&&o[k]!==null)p.append(E[k],String(o[k]))}
    p.append('submit','Submit');
    return p;
  }
  function send(o){
    try{fetch(F,{method:'POST',mode:'no-cors',body:params(o)}).catch(function(){})}catch(e){}
  }
  function beacon(o){
    try{
      if(navigator.sendBeacon&&navigator.sendBeacon(F,params(o)))return;
    }catch(e){}
    try{fetch(F,{method:'POST',mode:'no-cors',keepalive:true,body:params(o)}).catch(function(){})}catch(e){}
  }

  send({kind:'view',ref:ref,dev:dev});

  // YouTube 埋め込みの再生を記録（play のみ。秒数は取らない）
  if(document.querySelector('iframe.yt')){
    var tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady=function(){
      document.querySelectorAll('iframe.yt').forEach(function(f){
        var name=(f.getAttribute('src').match(/embed\/([^?]+)/)||[])[1]||'yt';
        try{new YT.Player(f,{events:{onStateChange:function(e){if(e.data===YT.PlayerState.PLAYING)send({kind:'play',video:'yt_'+name})}}})}catch(e){}
      });
    };
  }

  var flushers=[];
  // 動画ごとの累計再生秒（currentTime の進みを足す。シーク・止まっている間は数えない）
  document.querySelectorAll('video').forEach(function(v){
    var name=((v.getAttribute('src')||'').split('/').pop()||'').replace(/\.[^.]*$/,'')||'video';
    var acc=0,last=0,sent=0;
    v.addEventListener('play',function(){last=v.currentTime;send({kind:'play',video:name})});
    v.addEventListener('seeking',function(){last=v.currentTime});
    v.addEventListener('timeupdate',function(){
      var d=v.currentTime-last;
      if(d>0&&d<2)acc+=d;
      last=v.currentTime;
    });
    function report(){
      var s=Math.floor(acc);
      // 秒数は前回送ってからの増分（集計側で足し算する）
      if(s-sent>=3){var inc=s-sent;sent=s;send({kind:'watch',video:name,sec:inc})}
    }
    // 離脱時: 未送信の増分が1秒以上あれば sendBeacon で送る（3秒しきい値はここだけ無視）
    flushers.push(function(){
      var s=Math.floor(acc);
      if(s-sent>=1){var inc=s-sent;sent=s;beacon({kind:'watch',video:name,sec:inc})}
    });
    v.addEventListener('pause',report);
    v.addEventListener('ended',report);
  });

  // 最大スクロール率（%）
  var maxScroll=0;
  function onScroll(){
    try{
      var h=document.documentElement.scrollHeight;
      var p=h>0?Math.round((window.scrollY+window.innerHeight)/h*100):100;
      if(p>maxScroll)maxScroll=Math.min(100,p);
    }catch(e){}
  }
  onScroll();
  window.addEventListener('scroll',onScroll,{passive:true});

  // 離脱時に1回だけ
  var left=false;
  function leave(){
    if(left)return;
    left=true;
    onScroll();
    flushers.forEach(function(f){try{f()}catch(e){}});
    beacon({kind:'leave',video:'scroll'+maxScroll,sec:Math.round((Date.now()-t0)/1000)});
  }
  window.addEventListener('pagehide',leave);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')leave()});
})();
</script>
</body>
</html>
